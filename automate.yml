---
- name: Build Docker Image and Push to docker repository
  hosts: localhost
  become: true

  vars_files:
    - ./vars.yml
  
  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Enable docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Build Docker Image
      command: >
        docker build
        -t {{ DOCKER_USERNAME }}/{{ DOCKER_IMAGE }}:{{ DOCKER_TAG }}
        .

    - name: Docker Login
      shell: |
        echo "{{ DOCKER_PASSWORD }}" | docker login \
        -u {{ DOCKER_USERNAME }} \
        --password-stdin

    - name: Push Image to docker registry
      command: docker push {{ DOCKER_USERNAME }}/{{ DOCKER_IMAGE }}:{{ DOCKER_TAG }}



- name: Automate docker connection pipeline
  hosts: docker
  remote_user: jenkins
  become: true

  vars_files:
    - ./vars.yml

  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Enable docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Pull Docker Image
      command: >
        docker pull
        {{ DOCKER_USERNAME }}/{{ DOCKER_IMAGE }}:{{ DOCKER_TAG }}
        
    - name: Remove previously running container (if exists)
      command: docker rm -f {{ DOCKER_CONTAINER_NAME }}
      ignore_errors: yes

    - name: Run docker container
      command: >
        docker run -dit
        -p {{ TARGET_PORT }}:{{ DOCKER_CONTAINER_PORT }}
        --name {{ DOCKER_CONTAINER_NAME }}
        {{ DOCKER_USERNAME }}/{{ DOCKER_IMAGE }}:{{ DOCKER_TAG }}\
    
    - name: Server running on
      debug:
        msg: "http://20.44.53.215:80"
